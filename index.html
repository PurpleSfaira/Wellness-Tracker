<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Jamie's">
<meta name="theme-color" content="#e07a5f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<title>Jamie's Tracker</title>
<style>
:root{--bg:#fdf6ec;--card:#fff;--ac:#e07a5f;--gr:#81b29a;--tx:#3d405b;--mu:#8a8a9a;--bl:#5fa8d3;--pu:#9b8ec4}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{background:var(--ac);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:700;font-size:20px}
main{padding:12px;max-width:600px;margin:auto}.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:8px 0 4px}.mu{color:var(--mu);font-size:13px}
input,select{font-size:16px;padding:8px;border:1px solid #ddd;border-radius:10px;width:100%;margin:3px 0;background:#fff}
button{font-size:15px;padding:9px 12px;border:0;border-radius:10px;background:var(--ac);color:#fff;margin:3px 2px;cursor:pointer}
button.s{background:#eee;color:var(--tx)}button.g{background:var(--gr)}button.x{background:none;color:#c55;padding:2px 6px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:34px;font-weight:800}.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin:6px 0}.bar>div{height:100%;background:var(--gr)}
.it{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f2f2f2;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;margin:0;padding:8px 0}nav button.on{color:var(--ac);font-weight:700}nav b{display:block;font-size:20px}
.hide{display:none}.stat{text-align:center}.stat div:first-child{font-size:20px;font-weight:700}svg{width:100%}
label{font-size:13px;color:var(--mu)}
#scanvid{width:100%;max-height:240px;border-radius:12px;background:#111;display:block}
#fpreview{margin:6px 0;font-weight:700}input.qty{width:72px;flex:0 0 72px;margin:0}
#fresults .it{align-items:flex-start}
</style></head><body>
<header>🌿 Jamie's Tracker</header><main id="m"></main>
<nav id="nav"></nav>
<script src="app.js"></script></body></html>
